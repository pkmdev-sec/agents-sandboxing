# ASO - Agent Sandbox Orchestrator Configuration
# Default configuration file

# Default resource limits for agents
defaults:
  cpus: 2
  memory: "1g"
  timeout: "30m"

# Resource profiles by agent type
profiles:
  Explore:
    cpus: 2
    memory: "1g"
  Plan:
    cpus: 2
    memory: "1g"
  Bash:
    cpus: 4
    memory: "2g"
  code-reviewer:
    cpus: 2
    memory: "1g"
  general-purpose:
    cpus: 2
    memory: "1g"

# Cleanup settings
cleanup:
  auto: true
  retain_days: 7

# Container runtime settings
container:
  # Runtime to use: "docker" (recommended for enterprise/VPN compatibility) or "apple"
  runtime: "docker"

  # Agent runtime image
  image: "ghcr.io/agent-sandbox-orchestrator/agent-runtime:latest"

  # Pull image if not exists
  auto_pull: true

# Logging settings
logging:
  # Log directory
  dir: "~/.agent-sandboxes/logs"

  # Log level: debug, info, warn, error
  level: "info"

# MCP server settings (for Conductor integration)
mcp:
  # Enable MCP server
  enabled: true

  # Socket path for MCP communication
  socket: "~/.agent-sandboxes/mcp.sock"
